<!-- Interpolation Angular systématique (jamais d'injection HTML dynamique), conformément à
     docs/02_documentation/15_normesSecurite.md. -->
@if (liste().length > 0) {
  <div class="notification fixe d-flex direction-colonne ecart-2" aria-live="polite">
    @for (notif of liste(); track notif.id) {
      <div
        class="notification__item carte d-flex aligne-centre justifie-espace ecart-3 interieur-x-4 interieur-y-3 texte-sm"
        [class.notification__item--succes]="notif.type === 'succes'"
        [class.notification__item--erreur]="notif.type === 'erreur'"
        [attr.role]="notif.type === 'erreur' ? 'alert' : 'status'"
      >
        <span [class.texte-vert]="notif.type === 'succes'" [class.texte-rouge]="notif.type === 'erreur'">{{
          notif.message
        }}</span>
        <button
          type="button"
          class="bouton bouton--discret"
          aria-label="Fermer la notification"
          (click)="fermer(notif.id)"
        >
          ✕
        </button>
      </div>
    }
  </div>
}
