<!-- Interpolation Angular systématique, jamais d'injection HTML dynamique ([innerHTML]) : `libelleAccessible()`
     provient du composant appelant et peut inclure un identifiant technique externe (référence de dépendance),
     toujours échappé (docs/02_documentation/15_normesSecurite.md). Confirmation visuelle explicite (US-042) reprise
     du motif déjà retenu par `credentials.component.html` : texte visible, `role="status"`, `aria-live="polite"`. -->
<span class="bouton-copie d-inline-flex aligne-centre ecart-2">
  <button
    type="button"
    class="bouton bouton--discret"
    [attr.aria-label]="libelleAccessible()"
    (click)="copier()"
  >
    Copier
  </button>
  @if (etat() === 'copie') {
    <span class="texte-sm texte-discret" role="status" aria-live="polite">Copié</span>
  } @else if (etat() === 'echec') {
    <span class="texte-sm texte-rouge" role="status" aria-live="polite">Échec de la copie</span>
  }
</span>
