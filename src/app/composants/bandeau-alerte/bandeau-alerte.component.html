<!-- role="alert" : signal prioritaire annoncé immédiatement par les technologies d'assistance (RG-009). Identité
     visuelle magenta distincte des couleurs de jugement (cf. badge.component.scss), pour rester reconnaissable
     comme signal prioritaire parmi les autres codes de couleur de l'écran (RG-009, RNF-020). -->
<div
  class="bandeau-alerte d-flex aligne-centre justifie-espace ecart-4 largeur-pleine interieur-x-4 interieur-y-3 rayon-lg texte-sm"
  role="alert"
>
  <p class="bandeau-alerte__message exterieur-0 poids-demi-gras">{{ message() }}</p>
  @if (libelleAction(); as libelle) {
    <button
      type="button"
      class="bandeau-alerte__action bouton retrecit-non aucun-retour"
      (click)="declencherAction()"
    >
      {{ libelle }}
    </button>
  }
</div>
