<!-- Interpolation Angular systématique, jamais d'injection HTML dynamique ([innerHTML]) : libellé toujours affiché
     en clair, jamais porté par la seule couleur (RNF-020). -->
<span
  class="badge"
  [class.badge--vert]="couleur() === 'vert'"
  [class.badge--orange]="couleur() === 'orange'"
  [class.badge--rouge]="couleur() === 'rouge'"
  role="status"
>
  <span class="badge__pastille" aria-hidden="true"></span>
  <span class="badge__libelle">{{ libelle() }}</span>
</span>
