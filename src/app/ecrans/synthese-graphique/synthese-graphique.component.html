<div class="synthese-graphique d-flex direction-colonne ecart-4" #conteneurExport>
  <div class="synthese-graphique__filtres d-flex direction-colonne ecart-3">
    <app-filtre-groupe-projet
      [groupes]="groupesFiltrables()"
      [projets]="projetsFiltrables()"
      [groupeId]="filtreGroupeId()"
      [projetIds]="filtreProjetIds()"
      (selectionChangee)="onSelectionGroupeProjet($event)"
    >
      <app-selecteur-vue
        [vues]="vuesApplicables()"
        (vueAppliquee)="appliquerVue($event)"
        (enregistrementDemande)="enregistrerVue($event)"
        (suppressionDemandee)="supprimerVue($event)"
      />
    </app-filtre-groupe-projet>

    <div
      class="synthese-graphique__filtres-complementaires d-flex retour-ligne aligne-centre ecart-3"
    >
      <select
        #selectIndicateur
        class="synthese-graphique__select champ__controle"
        aria-label="Filtrer par type d'indicateur"
        (change)="onChangerIndicateur(selectIndicateur.value)"
      >
        @for (indicateur of indicateursDisponibles(); track indicateur.cle) {
          <option [value]="indicateur.cle" [selected]="indicateur.cle === filtreIndicateur()">
            {{ indicateur.libelle }}
          </option>
        }
      </select>

      <button
        type="button"
        class="synthese-graphique__export bouton bouton--marque exterieur-gauche-auto"
        (click)="exporterPng()"
      >
        Exporter en PNG
      </button>
    </div>
  </div>

  @if (nombreVuesIgnorees() > 0) {
    <p class="synthese-graphique__avertissement texte-orange texte-xs" role="status">
      {{ nombreVuesIgnorees() }} vue{{ nombreVuesIgnorees() > 1 ? 's' : '' }} enregistrée{{
        nombreVuesIgnorees() > 1 ? 's' : ''
      }}
      ignorée{{ nombreVuesIgnorees() > 1 ? 's' : '' }} (schéma de filtres obsolète).
    </p>
  }

  <app-graphique-evolution
    [series]="series()"
    [lignesVerticales]="lignesVerticales()"
    [messageAucuneDonnee]="messageAucuneDonnee()"
    (serieSelectionnee)="ouvrirFicheProjet($event)"
  />
</div>
