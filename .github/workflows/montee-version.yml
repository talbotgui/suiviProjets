# Workflow généré avec l'assistance de l'IA (Claude Code), conformément à la mention d'origine requise par
# .claude/rules/01-usage-ia-et-conventions.md.
#
# Déclenchement manuel (workflow_dispatch, numéro de version saisi) qui reporte le numéro de version demandé sur les
# trois fichiers qui le portent (`package.json`/`package-lock.json`, `src-tauri/tauri.conf.json`,
# `src-tauri/Cargo.toml`/`Cargo.lock`), puis ouvre une Pull Request vers `master` pour relecture et fusion
# explicites par le développeur (cf. auto-revue systématique avant toute intégration,
# docs/02_documentation/14_normesDeveloppement.md#règles-de-revue-de-code).
#
# Ce workflow ne crée aucun tag ni Release : il prépare uniquement le commit de montée de version que le workflow
# « Publication Windows » (.github/workflows/publication-windows.yml) exige déjà comme préalable committé sur
# `master` avant de publier (cf. docs/02_documentation/19_environnementProduction.md#gestion-des-versions-et-des-mises-à-jour).
name: Montée de version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nouveau numéro de version à appliquer (SemVer, sans préfixe v), ex. 0.2.0'
        required: true
        type: string

jobs:
  montee-version:
    name: Application du numéro de version et ouverture de la Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Contrôle du format SemVer
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Le numéro de version '${{ inputs.version }}' ne respecte pas le format SemVer attendu (X.Y.Z)."
            exit 1
          fi

      - name: Installation de Node.js (version fixée par .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installation des dépendances Angular/npm verrouillées
        run: npm ci

      - name: Sélection de la toolchain Rust (version et composants fixés par rust-toolchain.toml)
        run: rustup show

      - name: Installation des dépendances système Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Mise à jour de package.json et package-lock.json
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Mise à jour de src-tauri/tauri.conf.json
        run: |
          jq --arg version "${{ inputs.version }}" '.version = $version' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      # Seule la première occurrence de `version = "..."` est remplacée (celle du bloc [package]), les dépendances
      # exprimant la leur en table inline (`{ version = "..." }`) et non en clé de premier niveau.
      - name: Mise à jour de src-tauri/Cargo.toml
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ inputs.version }}\"/" src-tauri/Cargo.toml

      - name: Régénération de src-tauri/Cargo.lock (cohérence avec le Cargo.toml mis à jour)
        working-directory: src-tauri
        run: cargo check

      - name: Contrôle de cohérence des trois fichiers avant ouverture de la Pull Request
        run: |
          version_package=$(node -pe "require('./package.json').version")
          version_tauri=$(node -pe "require('./src-tauri/tauri.conf.json').version")
          version_cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$version_package" != "${{ inputs.version }}" || "$version_tauri" != "${{ inputs.version }}" || "$version_cargo" != "${{ inputs.version }}" ]]; then
            echo "::error::Incohérence après mise à jour (package.json: $version_package, tauri.conf.json: $version_tauri, Cargo.toml: $version_cargo) pour la version demandée '${{ inputs.version }}'."
            exit 1
          fi

      - name: Configuration de l'identité Git du commit automatique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Création de la branche courte et du commit de montée de version
        id: commit
        run: |
          branch="version/${{ inputs.version }}"
          git checkout -b "$branch"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "::notice::Aucun changement à committer : les trois fichiers portent déjà la version '${{ inputs.version }}'."
            echo "changements=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(version): passage en ${{ inputs.version }}"
          git push origin "$branch"
          echo "changements=true" >> "$GITHUB_OUTPUT"

      - name: Ouverture de la Pull Request vers master
        if: steps.commit.outputs.changements == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "version/${{ inputs.version }}" \
            --title "chore(version): passage en ${{ inputs.version }}" \
            --body "Montée de version automatique vers **${{ inputs.version }}** (package.json, package-lock.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock), déclenchée manuellement via le workflow « Montée de version ». À relire puis fusionner avant de lancer, le cas échéant, le workflow « Publication Windows » sur cette même version."
