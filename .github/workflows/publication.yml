# Workflow généré avec l'assistance de l'IA (Claude Code), conformément à la mention d'origine requise par
# .claude/rules/01-usage-ia-et-conventions.md.
#
# Généralisation, en Phase 14 (docs/03_plan/plan_13_developpement.md#phase-14--intégration-continue-empaquetage-et-publication),
# de l'ancien workflow « Publication Windows » (`publication-windows.yml`) : build multiplateforme (matrice
# Windows/macOS/Linux, dont l'archive ZIP portable Windows), déclenché par un tag `vX.Y.Z` poussé ou manuellement
# (`workflow_dispatch`, qui crée alors lui-même le tag), avec ré-exécution complète du pipeline de validation en
# préalable bloquant (le pipeline ne s'exécute plus automatiquement à chaque commit depuis cette même phase, cf.
# docs/02_documentation/18_pic.md#mise-en-place-du-pipeline) ; génération et publication de la couverture de code
# combinée (Rust + TypeScript) sur GitHub Pages à chaque release, lien inséré dans les notes de la Release.
#
# Explicitement hors périmètre à ce stade (décision humaine actée le 2026-07-24, non remise en cause par cette
# généralisation, faute du plugin tauri-plugin-updater dans src-tauri/Cargo.toml à ce jour) : signature des
# exécutables et génération du manifeste de mise à jour de l'updater Tauri (bundle.createUpdaterArtifacts). À
# ajouter lors de la mise en place effective de l'updater, avec le secret TAURI_SIGNING_PRIVATE_KEY.
#
# Préalable humain à la publication de la couverture sur GitHub Pages : activation de GitHub Pages sur le dépôt
# (Settings → Pages → Source : GitHub Actions), action de configuration de plateforme non réalisable par l'IA.
name: Publication

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numéro de version à publier (SemVer, sans préfixe v), ex. 0.2.0'
        required: true
        type: string

jobs:
  validation:
    name: Validation complète (préalable bloquant)
    uses: ./.github/workflows/validation.yml

  verification-version:
    name: Vérification du numéro de version
    needs: validation
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Le numéro de version provient soit du tag Git poussé (push), soit de la saisie manuelle (workflow_dispatch).
      - name: Détermination du numéro de version
        id: version-brute
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Contrôle du format SemVer
        run: |
          if ! [[ "${{ steps.version-brute.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Le numéro de version '${{ steps.version-brute.outputs.version }}' ne respecte pas le format SemVer attendu (X.Y.Z)."
            exit 1
          fi

      # Le numéro de version doit correspondre à celui déjà committé dans tauri.conf.json et Cargo.toml (bump de
      # version fait par le développeur, cf. docs/02_documentation/19_environnementProduction.md#gestion-des-versions-et-des-mises-à-jour) :
      # ce workflow ne modifie jamais ces fichiers lui-même, pour ne jamais publier une Release dont le numéro de
      # version diverge silencieusement du code réellement figé dans l'historique Git.
      - name: Contrôle de cohérence avec la version committée (tauri.conf.json, Cargo.toml)
        run: |
          version_tauri=$(node -pe "require('./src-tauri/tauri.conf.json').version")
          version_cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$version_tauri" != "${{ steps.version-brute.outputs.version }}" || "$version_cargo" != "${{ steps.version-brute.outputs.version }}" ]]; then
            echo "::error::Version demandée '${{ steps.version-brute.outputs.version }}' ≠ version committée (tauri.conf.json: $version_tauri, Cargo.toml: $version_cargo). Committer d'abord le bump de version sur les deux fichiers."
            exit 1
          fi

      - name: Calcul du nom de tag
        id: tag
        run: |
          echo "tag=v${{ steps.version-brute.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.version-brute.outputs.version }}" >> "$GITHUB_OUTPUT"

  build:
    name: Génération des livrables
    needs: verification-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js (version fixée par .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Installation des dépendances Angular/npm verrouillées
        run: npm ci

      - name: Sélection de la toolchain Rust (version et composants fixés par rust-toolchain.toml)
        run: rustup show

      - name: Installation des dépendances système Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file

      - name: 'Build de l''installeur natif via Tauri (bundle.targets: "all" de tauri.conf.json)'
        run: npm run tauri build

      - name: Constitution de l'archive .zip portable (Windows uniquement, exécutable autonome sans installation)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ needs.verification-version.outputs.version }}"
          $exeSource = "src-tauri/target/release/suivi_qualimetrie.exe"
          $stagingDir = "src-tauri/target/release/bundle/portable/SuiviQualimetrie-$version-portable"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item $exeSource -Destination "$stagingDir/SuiviQualimetrie.exe"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath "src-tauri/target/release/bundle/portable/SuiviQualimetrie-$version-portable.zip"

      - name: Archivage temporaire des livrables Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: livrable-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.zip
          retention-days: 7

      - name: Archivage temporaire des livrables macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: livrable-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: Archivage temporaire des livrables Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: livrable-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  couverture-pages:
    name: Publication de la couverture de code (GitHub Pages)
    needs: validation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      lien: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupération du site de couverture généré par la validation
        uses: actions/download-artifact@v4
        with:
          name: site-couverture
          path: site-couverture

      - name: Préparation de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-couverture

      - name: Déploiement sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4

  publication-release:
    name: Création du tag et publication de la GitHub Release
    needs: [verification-version, build, couverture-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du code (historique complet pour le changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le tag existe déjà si ce workflow a été déclenché par un tag poussé (push) ; il reste à créer et pousser
      # uniquement dans le cas d'un déclenchement manuel (workflow_dispatch).
      - name: Création et publication du tag de version (déclenchement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.verification-version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Version $TAG"
          git push origin "$TAG"

      - name: Récupération des livrables Windows
        uses: actions/download-artifact@v4
        with:
          name: livrable-windows
          path: livrables

      - name: Récupération des livrables macOS
        uses: actions/download-artifact@v4
        with:
          name: livrable-macos
          path: livrables

      - name: Récupération des livrables Linux
        uses: actions/download-artifact@v4
        with:
          name: livrable-linux
          path: livrables

      - name: Publication de la GitHub Release avec changelog Conventional Commits
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verification-version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            livrables/msi/*.msi \
            livrables/nsis/*.exe \
            livrables/portable/*.zip \
            livrables/dmg/*.dmg \
            livrables/deb/*.deb \
            livrables/appimage/*.AppImage

      # `gh release create --notes`/`--generate-notes` sont mutuellement exclusifs : le lien vers le rapport de
      # couverture est donc ajouté séparément, en tête des notes déjà générées à partir des Conventional Commits.
      - name: Ajout du lien vers le rapport de couverture de code aux notes de la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verification-version.outputs.tag }}
          LIEN_COUVERTURE: ${{ needs.couverture-pages.outputs.lien }}
        run: |
          notes_existantes=$(gh release view "$TAG" --json body -q .body)
          printf 'Rapport de couverture de code (Rust + TypeScript) : %s\n\n%s' "$LIEN_COUVERTURE" "$notes_existantes" \
            | gh release edit "$TAG" --notes-file -
